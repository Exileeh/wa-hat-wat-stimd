name: Diagnose Notubiz reachability

# Throwaway, manual-only. The weekly refresh gets "URLError" (no HTTP response at all) from
# api.notubiz.nl on GitHub-hosted runners, while the same request works from a normal connection.
# This shows exactly where the connection stops: DNS, TCP connect, TLS, or HTTP. Delete once solved.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner identity
        run: |
          echo "Runner public IPv4: $(curl -4 -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo "Runner region hint: ${RUNNER_OS} / $(curl -s --max-time 5 -H Metadata:true 'http://169.254.169.254/metadata/instance/compute/location?api-version=2021-02-01&format=text' || echo unknown)"

      - name: DNS
        run: |
          for h in api.notubiz.nl pzh.notubiz.nl howtheyvote.eu; do
            echo "== $h"; getent ahosts "$h" || echo "  DNS FAILED"
          done

      - name: Control request (a host that works from CI)
        run: curl -sS -o /dev/null -w "howtheyvote.eu -> HTTP %{http_code} in %{time_total}s\n" --connect-timeout 10 --max-time 20 https://howtheyvote.eu/api/votes?page_size=1 || true

      - name: api.notubiz.nl, verbose (IPv4)
        run: |
          curl -4 -v --connect-timeout 10 --max-time 25 \
            -A "wie-stemde-wat collector (open-data overview; contact via GitHub)" \
            "https://api.notubiz.nl/events?organisation_id=3868&date_from=2026-09-01+00%3A00%3A00&date_to=2026-09-10+23%3A59%3A59&page=1&format=json&version=1.21" \
            -o body.txt 2>&1 | grep -vE '^[<>] (Accept|Host|Cache|Expires|Pragma|Vary|X-XSS)' || true
          echo "--- exit/body ---"; wc -c body.txt 2>/dev/null; head -c 300 body.txt 2>/dev/null; echo

      - name: api.notubiz.nl, IPv6
        run: curl -6 -sS -o /dev/null -w "IPv6 -> HTTP %{http_code}\n" --connect-timeout 10 --max-time 20 https://api.notubiz.nl/ || true

      - name: pzh.notubiz.nl portal (same vendor, different host)
        run: curl -4 -sS -o /dev/null -w "pzh.notubiz.nl -> HTTP %{http_code} in %{time_total}s\n" --connect-timeout 10 --max-time 20 https://pzh.notubiz.nl/ || true

      - name: Plain TCP connect to 443 (no TLS)
        run: |
          ip=$(getent ahostsv4 api.notubiz.nl | awk 'NR==1{print $1}')
          echo "api.notubiz.nl -> $ip"
          timeout 12 bash -c "echo > /dev/tcp/$ip/443" && echo "TCP 443: connected" || echo "TCP 443: FAILED (refused/dropped/timeout)"

      - name: Python urllib, exactly like the collector
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          u = ("https://api.notubiz.nl/events?organisation_id=3868&date_from=2026-09-01+00%3A00%3A00"
               "&date_to=2026-09-10+23%3A59%3A59&page=1&format=json&version=1.21")
          req = urllib.request.Request(u, headers={"User-Agent": "wie-stemde-wat collector (open-data overview; contact via GitHub)"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("urllib -> HTTP", r.status, len(r.read()), "bytes")
          except urllib.error.HTTPError as e:
              print("urllib -> HTTPError", e.code)
          except urllib.error.URLError as e:
              print("urllib -> URLError, reason:", repr(e.reason))
          except Exception as e:
              print("urllib ->", type(e).__name__, repr(e))
          PY
