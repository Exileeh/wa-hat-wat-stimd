name: Ververs stemdata Fryslân

# Dagelijks de stemdata verversen + handmatig te starten (Actions -> Run workflow).
#
# Let op: api.notubiz.nl blokkeert GitHub's cloudservers. De requests lopen daarom via de relay
# op Vercel (api/notubiz.py, regio fra1): zet de secrets NOTUBIZ_RELAY (de URL van die functie)
# en RELAY_KEY (dezelfde waarde als in de Vercel-projectinstellingen) onder Settings -> Secrets
# and variables -> Actions. Zonder die secrets doet de collector gewone directe requests, logt
# "KNOWN ISSUE ... Network is unreachable", houdt het bestaande databestand en eindigt groen.
# Alternatief: een self-hosted runner op een Nederlandse machine via de repository variable
# RUNNER. Zie docs/notubiz.md.
on:
  schedule:
    - cron: "0 6 * * *"   # dagelijks 06:00 UTC (~08:00 NL)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # collect.py exits 1 when the source lost data (REGRESSION) or has been unreachable for
      # longer than 45 days. We still want the commit step to run, so: record the outcome here,
      # commit whatever did refresh, then fail the job at the end.
      # Optional: lets the collector read the griffie's "Útslach stimming" PDFs (the only place
      # the hoofdelijke stemmingen are published since 2026-05-27). If this fails the collector
      # still runs and reports which meetings it skipped.
      - name: Install PDF reader dependencies
        continue-on-error: true
        shell: bash
        run: python -m pip install -q --disable-pip-version-check -r collector/requirements-pdf.txt

      - name: Run collector
        id: collect
        continue-on-error: true
        shell: bash
        env:
          NOTUBIZ_RELAY: ${{ secrets.NOTUBIZ_RELAY }}   # https://<project>.vercel.app/api/notubiz
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: python collector/collect.py

      - name: Commit updated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fryslan.json data/roles.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "chore: ververs stemdata Fryslân"
            git push
          fi

      # A silent degradation must become a red run — that is what sends the notification e-mail.
      - name: Fail if the source lost data
        if: steps.collect.outcome == 'failure'
        shell: bash
        run: |
          echo "::error title=Source regression::The collector lost data or the data is stale. See the collector log above (search for REGRESSION / KNOWN ISSUE) and docs/notubiz.md."
          exit 1
